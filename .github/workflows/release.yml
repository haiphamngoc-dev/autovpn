name: "Publish Release"

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Add Rust targets for macOS Universal
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Download and extract OpenVPN (Windows)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://swupdate.openvpn.org/community/releases/OpenVPN-2.6.12-I001-amd64.msi" -OutFile "openvpn-installer.msi"
          Start-Process msiexec.exe -ArgumentList "/a openvpn-installer.msi /qb TARGETDIR=C:\openvpn-extracted" -Wait
          New-Item -ItemType Directory -Force -Path target/release/openvpn-windows
          $openvpnExe = Get-ChildItem -Path C:\openvpn-extracted -Filter "openvpn.exe" -Recurse | Select-Object -First 1
          if ($openvpnExe) {
            $binDir = $openvpnExe.Directory.FullName
            Copy-Item -Path "$binDir\*" -Destination target/release/openvpn-windows/ -Force
          } else {
            throw "Could not find openvpn.exe inside extracted files!"
          }

      - name: Download and extract OpenVPN (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p target/release/openvpn-macos
          RELEASE_URL=$(curl -s https://api.github.com/repos/Tunnelblick/Tunnelblick/releases/latest | jq -r '.assets[] | select(.name | endswith(".dmg")) | .browser_download_url' | head -n 1)
          curl -L -o tunnelblick.dmg "$RELEASE_URL"
          hdiutil attach tunnelblick.dmg -mountpoint /Volumes/Tunnelblick
          OPENVPN_SRC=$(find /Volumes/Tunnelblick/Tunnelblick.app/Contents/Resources/ -name "openvpn" -type f | head -n 1)
          if [ -n "$OPENVPN_SRC" ]; then
            cp "$OPENVPN_SRC" target/release/openvpn-macos/openvpn
            chmod 755 target/release/openvpn-macos/openvpn
            echo "Successfully extracted OpenVPN macOS binary from Tunnelblick: $OPENVPN_SRC"
          else
            echo "Error: could not find openvpn binary in Tunnelblick.app"
            exit 1
          fi
          hdiutil detach /Volumes/Tunnelblick

      - name: Build helper-daemon (Windows/Linux)
        if: matrix.platform != 'macos-latest'
        run: cargo build --release --package helper-daemon

      - name: Build helper-daemon (macOS Universal)
        if: matrix.platform == 'macos-latest'
        run: |
          cargo build --release --package helper-daemon --target x86_64-apple-darwin
          cargo build --release --package helper-daemon --target aarch64-apple-darwin
          mkdir -p target/release
          lipo -create target/x86_64-apple-darwin/release/helper-daemon target/aarch64-apple-darwin/release/helper-daemon -output target/release/helper-daemon

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "AutoVPN ${{ github.ref_name }}"
          releaseBody: |
            AutoVPN version ${{ github.ref_name }} release builds.

            Multi-platform packages included:
            - **Linux**: `.deb`, `.AppImage`
            - **Windows**: `.exe` (NSIS Installer)
            - **macOS**: `.dmg` Universal Binary (Apple Silicon & Intel)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload updater assets as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: updater-assets-${{ matrix.platform }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/**/*.sig
            packages/desktop/src-tauri/target/release/bundle/**/*.AppImage
            packages/desktop/src-tauri/target/release/bundle/**/*.zip
            packages/desktop/src-tauri/target/release/bundle/**/*.tar.gz

  publish-updater:
    permissions:
      contents: write
    needs: publish-tauri
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all updater artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: updater-assets-*
          merge-multiple: true

      - name: Generate and Update updater.json
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUM=${VERSION#v}

          # Find Linux AppImage and Signature
          LINUX_TAR=$(find assets -name "*.AppImage" | head -n 1)
          LINUX_SIG=$(find assets -name "*.AppImage.sig" | head -n 1)
          if [ -z "$LINUX_TAR" ] || [ -z "$LINUX_SIG" ]; then
            LINUX_TAR=$(find assets -name "*.tar.gz" ! -name "*darwin*" ! -name "*osx*" ! -name "control.tar.gz" ! -name "data.tar.gz" | head -n 1)
            LINUX_SIG=$(find assets -name "*.sig" ! -name "*darwin*" ! -name "*osx*" ! -name "*control*" ! -name "*data*" | head -n 1)
          fi

          # Find Windows zip and Signature
          WINDOWS_TAR=$(find assets -name "*.zip" ! -name "*darwin*" ! -name "*osx*" | head -n 1)
          WINDOWS_SIG=$(find assets -name "*.zip.sig" ! -name "*darwin*" ! -name "*osx*" | head -n 1)

          # Find macOS tar.gz and Signature
          MACOS_TAR=$(find assets -name "*.app.tar.gz" | head -n 1)
          MACOS_SIG=$(find assets -name "*.app.tar.gz.sig" | head -n 1)
          if [ -z "$MACOS_TAR" ] || [ -z "$MACOS_SIG" ]; then
            MACOS_TAR=$(find assets -name "*.tar.gz" -name "*darwin*" -o -name "*osx*" | head -n 1)
            MACOS_SIG=$(find assets -name "*.sig" -name "*darwin*" -o -name "*osx*" | head -n 1)
          fi

          # Read signatures and file names
          LINUX_SIGNATURE=$(cat "$LINUX_SIG" 2>/dev/null || echo "")
          WINDOWS_SIGNATURE=$(cat "$WINDOWS_SIG" 2>/dev/null || echo "")
          MACOS_SIGNATURE=$(cat "$MACOS_SIG" 2>/dev/null || echo "")

          LINUX_NAME=$(basename "$LINUX_TAR" 2>/dev/null || echo "")
          WINDOWS_NAME=$(basename "$WINDOWS_TAR" 2>/dev/null || echo "")
          MACOS_NAME=$(basename "$MACOS_TAR" 2>/dev/null || echo "")

          # Dynamically build updater.json using jq
          jq -n \
            --arg version "$VERSION_NUM" \
            --arg notes "Release AutoVPN $VERSION with auto-update support." \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg linux_sig "$LINUX_SIGNATURE" \
            --arg linux_url "https://github.com/haiphamngoc-dev/autovpn/releases/download/$VERSION/$LINUX_NAME" \
            --arg win_sig "$WINDOWS_SIGNATURE" \
            --arg win_url "https://github.com/haiphamngoc-dev/autovpn/releases/download/$VERSION/$WINDOWS_NAME" \
            --arg mac_sig "$MACOS_SIGNATURE" \
            --arg mac_url "https://github.com/haiphamngoc-dev/autovpn/releases/download/$VERSION/$MACOS_NAME" \
            '{
               version: $version,
               notes: $notes,
               pub_date: $pub_date,
               platforms: {}
             } | 
             if $linux_sig != "" then .platforms["linux-x86_64"] = {signature: $linux_sig, url: $linux_url} else . end |
             if $win_sig != "" then .platforms["windows-x86_64"] = {signature: $win_sig, url: $win_url} else . end |
             if $mac_sig != "" then 
               .platforms["darwin-x86_64"] = {signature: $mac_sig, url: $mac_url} |
               .platforms["darwin-aarch64"] = {signature: $mac_sig, url: $mac_url}
             else . end' > updater.json

          echo "Generated updater.json:"
          cat updater.json

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add updater.json
          git commit -m "chore: update updater.json for version $VERSION [skip ci]" || true
          git push origin HEAD:main || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
